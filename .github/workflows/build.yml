name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  vita-runtime:
    name: Vita executable
    runs-on: ubuntu-latest
    # Nothing here has run on a runner yet. Remove this once the first run is green,
    # so that a broken Vita build fails the workflow instead of being skipped.
    continue-on-error: true
    env:
      VITASDK: /home/runner/vitasdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install VitaSDK
        run: |
          git clone --depth 1 https://github.com/vitasdk/vdpm "$RUNNER_TEMP/vdpm"
          "$RUNNER_TEMP/vdpm/bootstrap-vitasdk.sh" --install-dir "$VITASDK"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Install nightly Rust and cargo-vita
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo +nightly install cargo-vita --locked

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/psv-runtime/target
          key: vita-${{ runner.os }}-${{ hashFiles('crates/psv-runtime/Cargo.lock', 'crates/psv-runtime/Cargo.toml') }}
          restore-keys: vita-${{ runner.os }}-

      - name: Build eboot.bin
        working-directory: crates/psv-runtime
        run: cargo vita build eboot -- --release

      - name: Collect eboot.bin
        run: |
          eboot="$(find crates/psv-runtime/target -name eboot.bin -print -quit)"
          test -n "$eboot" || { echo "cargo-vita produced no eboot.bin" >&2; exit 1; }
          mkdir -p out
          cp "$eboot" out/eboot.bin
          sha256sum out/eboot.bin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vita-eboot
          path: out/eboot.bin
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows app (${{ matrix.profile }})
    runs-on: windows-latest
    needs: vita-runtime
    if: ${{ !cancelled() }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            cargo_flags: ""
          - profile: release
            cargo_flags: "--release"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            horizon-src/target
          key: windows-${{ matrix.profile }}-${{ hashFiles('Cargo.lock', 'packaging/horizon-rev.txt') }}
          restore-keys: windows-${{ matrix.profile }}-

      - name: Fetch the pinned Horizon revision
        run: bash scripts/fetch-horizon.sh horizon-src

      - name: Build horizon-prepare
        run: cargo build --release --locked --manifest-path horizon-src/Cargo.toml -p horizon-prepare

      - name: Build the app
        run: cargo build --locked ${{ matrix.cargo_flags }} -p psv-builder

      - name: Download the Vita executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: vita-eboot
          path: eboot

      - name: Assemble the release folder
        run: |
          mkdir -p dist
          cp "target/${{ matrix.profile }}/mcjavapsv.exe" "target/${{ matrix.profile }}/mcjavapsv-cli.exe" dist/
          bash scripts/stage-payload.sh horizon-src dist/payload eboot/eboot.bin
          cp -r docs dist/docs
          cp LICENSE README.md dist/
          (cd dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcjavapsv-windows-${{ matrix.profile }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcjavapsv-windows-release
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr "../mcjavapsv-${GITHUB_REF_NAME}-windows.zip" .)
          gh release create "$GITHUB_REF_NAME" "mcjavapsv-${GITHUB_REF_NAME}-windows.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "This release contains no Minecraft files. You need your own copy of Minecraft: Java Edition. Anything you build is for your personal use only and must not be shared. Read docs/LEGAL.md."

[workspace]
resolver = "3"
members = ["crates/psv-vpk", "crates/psv-setup", "crates/psv-builder"]
exclude = ["crates/psv-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/SSMG64/MCJavaPSV"
authors = ["SSMG64 and the MCJavaPSV contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

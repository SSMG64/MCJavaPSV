[package]
name = "psv-runtime"
description = "The executable that runs on the PlayStation Vita"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SSMG64/MCJavaPSV"
publish = false

[workspace]

[dependencies]
thiserror = "2"
psv-pack = { path = "../psv-pack" }
psv-render = { path = "../psv-render" }
horizon-core = { git = "https://github.com/ludovic111/horizon", rev = "02c8607ee8ebd216f2f535c1eb7b62b572830df2" }
horizon-world = { git = "https://github.com/ludovic111/horizon", rev = "02c8607ee8ebd216f2f535c1eb7b62b572830df2" }

[features]
# The Vita graphics demo. It needs vitaGL installed in the SDK; see docs/BUILDING-PSV.md.
gfx = []

[package.metadata.vita]
title_id = "MCJVPSV01"
title_name = "MCJavaPSV"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[dev-dependencies]
tempfile = "3"

[package]
name = "psv-builder"
description = "Windows app that builds a PS Vita package from the player's own Minecraft install"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "psv_builder"

[[bin]]
name = "mcjavapsv"
path = "src/bin/mcjavapsv.rs"

[[bin]]
name = "mcjavapsv-cli"
path = "src/bin/mcjavapsv-cli.rs"

[dependencies]
psv-bake = { path = "../psv-bake" }
psv-setup = { path = "../psv-setup" }
psv-vpk = { path = "../psv-vpk" }
clap = { version = "4", features = ["derive"] }
dirs = "7"
eframe = "0.37"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }

[build-dependencies]
psv-vpk = { path = "../psv-vpk" }
winresource = "0.1"

[dev-dependencies]
psv-pack = { path = "../psv-pack" }
png = { version = "0.18", default-features = false }
egui_kittest = "0.37"
tempfile = "3"
zip = { version = "9.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
